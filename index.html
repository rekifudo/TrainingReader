<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meaning Reader · 意群阅读器</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#273236;font:16px/1.8 system-ui,sans-serif}header{position:sticky;top:0;background:#f5f2e9f5;backdrop-filter:blur(12px);z-index:3;padding:12px 20px;border-bottom:1px solid #ded8cb}.tools{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select,input[type=file]{font:14px system-ui;padding:7px;background:#fffdf6;border:1px solid #b5c1b7;border-radius:5px}button{cursor:pointer}input[type=range]{width:95px}label{font-size:13px}#status{max-width:1000px;margin:6px auto 0;color:#728070;font-size:12px}main{max-width:800px;margin:auto;padding:35px 30px 50vh}h1{font:32px/1.4 Georgia,serif}h2{font-size:13px;color:#778575;font-weight:400;margin-top:40px}.pair{position:relative;margin:0 0 24px;padding:8px 10px 8px 20px;border-left:2px solid transparent;cursor:pointer}.pair.current{border-left-color:#587767;background:#eceee3}.number{font:11px system-ui;color:#8e998d;position:absolute;left:-20px;top:12px}.en{font:22px/1.9 Georgia,serif;margin:0}.zh{margin:8px 0 0;color:#737e70;font-size:16px;line-height:1.8}.hidezh .zh{display:none}.main{background:#e7edf0}.condition{background:#f3ead8}.reason{background:#e4eedf}.contrast{background:#f2e2e4}.modifier{background:#ece5f0}.chunk{border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.plain .chunk{background:none}.legend{font-size:12px;display:flex;gap:10px;flex-wrap:wrap;color:#778575}.legend span{padding:2px 5px}details{color:#778575;font-size:13px}details img{width:100%}.intro{font-size:14px;color:#778575}a{color:#386653}.counter{font-variant-numeric:tabular-nums}button:focus-visible,select:focus-visible,.pair:focus-visible{outline:2px solid #487960;outline-offset:3px}@media(max-width:650px){main{padding:24px}.en{font-size:20px}header{padding:9px}input[type=range]{width:65px}}
</style></head><body><header><div class="tools"><button id="read">朗读英文</button><select id="voice" aria-label="英文声音"></select><label>朗读语速 <input id="rate" type="range" min="0.6" max="1.4" step=".05"><output id="rateValue"></output></label><label>音调 <input id="pitch" type="range" min=".5" max="1.2" step=".05"><output id="pitchValue"></output></label><button id="scroll">自动滚动</button><label>阅读速度 <input id="wpm" type="range" min="60" max="450" step="10"><output id="wpmValue"></output> WPM</label><button id="previous">上一段</button><button id="next">下一段</button><button id="locate">定位当前段</button><button id="zh">隐藏中文</button><button id="colors">色块开／关</button><label>导入 JSON <input id="import" type="file" accept=".json,application/json"></label><button id="export">导出阅读材料</button></div><div id="status" role="status" aria-live="polite"></div></header><main><h1 id="title"></h1><p id="subtitle" class="intro"></p><div class="legend"><span class="main">主干</span><span class="condition">条件／时间</span><span class="reason">原因／目的</span><span class="contrast">转折</span><span class="modifier">修饰／解释</span></div><p class="intro">先读英文，再核对紧接其下的中文。点击中英文可以定位，朗读跟随同一组。声音取决于系统；音调调整不保证改变音色。不开页自动播放。</p><div id="book"></div></main><script>window.READER_DATA={"id": "meaning-reader-original-demo-v1", "title": "Learning to read in meaning groups", "subtitle": "Original bilingual demo · 自写示例 · MIT licensed", "pairs": [{"page": 1, "en": "A reader can understand a difficult paper more easily when each idea stays close to its translation.", "zh": "当每个意思都紧挨着对应翻译时，读者更容易理解一篇难懂的论文。", "chunks": [{"text": "A reader can understand a difficult paper more easily", "role": "main"}, {"text": "when each idea stays close to its translation.", "role": "condition"}]}, {"page": 1, "en": "Rather than translating every word, try to recognize phrases that belong together.", "zh": "与其逐词翻译，不如尝试辨认意思连在一起的词组。", "chunks": [{"text": "Rather than translating every word,", "role": "contrast"}, {"text": "try to recognize phrases that belong together.", "role": "main"}]}, {"page": 1, "en": "The soft colors are reading hints. They do not represent the only correct grammatical analysis.", "zh": "浅色块是阅读提示。它们不代表唯一正确的语法分析。"}, {"page": 1, "en": "You can listen to the English while following the highlighted paragraph. Pause whenever you need more time.", "zh": "你可以听英文，同时跟随高亮段落阅读。需要更多时间时，随时暂停。"}, {"page": 2, "en": "A useful reading tool should give you control over its pace, voice, and display.", "zh": "一个有用的阅读工具，应让你控制阅读节奏、声音和显示方式。"}, {"page": 2, "en": "Short bilingual paragraphs reduce the distance between the original text and the explanation.", "zh": "简短的双语段落，可以缩短原文与解释之间的距离。"}]};</script><script>'use strict';
const $=id=>document.getElementById(id), synth=window.speechSynthesis;
let data=window.READER_DATA, position=0, mode='paused', timer=0, generation=0, utterance=null, voices=[];
let settings={wpm:250,rate:.9,pitch:.8,voice:'',hidezh:false,colors:true};
try{Object.assign(settings,JSON.parse(localStorage.getItem('meaning-reader-settings')||'{}'));}catch{}
function save(){try{localStorage.setItem('meaning-reader-settings',JSON.stringify(settings));localStorage.setItem('meaning-reader-position:'+data.id,String(position));}catch{}}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function colored(p){if(!p.chunks)return escape(p.en);return p.chunks.map(c=>'<span class="chunk '+(['main','condition','reason','contrast','modifier'].includes(c.role)?c.role:'main')+'">'+escape(c.text)+'</span>').join(' ');}
function restore(){try{position=Math.max(0,Math.min(data.pairs.length-1,Number(localStorage.getItem('meaning-reader-position:'+data.id))||0));}catch{position=0;}}
function render(){if(!valid(data))throw Error('Invalid reader data');restore();$('title').textContent=data.title;$('subtitle').textContent=data.subtitle||'';let lastPage=null;let body='';data.pairs.forEach((p,i)=>{if(p.page!==lastPage){body+='<h2>Page '+escape(p.page||1)+'</h2>';lastPage=p.page;}body+='<article class="pair" data-index="'+i+'" tabindex="0" aria-label="Reading pair '+(i+1)+'"><span class="number">'+(i+1)+'</span><p class="en">'+colored(p)+'</p><p class="zh">'+escape(p.zh)+'</p></article>';if(p.originalImage)body+='<details><summary>Original page / 原始页面</summary><img alt="Original page" loading="lazy" src="'+escape(p.originalImage)+'"></details>';});$('book').innerHTML=body;document.querySelectorAll('.pair').forEach(el=>{const choose=()=>{stop();position=Number(el.dataset.index);highlight(true);save();};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();choose();}};});sync();highlight(false);}
function valid(d){return d&&typeof d.id==='string'&&typeof d.title==='string'&&Array.isArray(d.pairs)&&d.pairs.length>0&&d.pairs.every(p=>p&&typeof p.en==='string'&&typeof p.zh==='string'&&p.en.trim()&&p.zh.trim());}
function sync(){$('wpm').value=settings.wpm;$('rate').value=settings.rate;$('pitch').value=settings.pitch;$('wpmValue').textContent=settings.wpm;$('rateValue').textContent=Number(settings.rate).toFixed(2)+'×';$('pitchValue').textContent=Number(settings.pitch).toFixed(2);document.body.classList.toggle('hidezh',settings.hidezh);document.body.classList.toggle('plain',!settings.colors);$('zh').textContent=settings.hidezh?'显示中文':'隐藏中文';$('read').textContent=mode==='speech'?'停止朗读':'朗读英文';$('scroll').textContent=mode==='scroll'?'暂停滚动':'自动滚动';$('status').textContent=(mode==='speech'?'朗读中':mode==='scroll'?'滚动中':'已暂停')+' · '+(position+1)+' / '+data.pairs.length+' · 点击任意中英段落定位 · 空格暂停 · 进度自动保存';}
function highlight(follow){document.querySelector('.pair.current')?.classList.remove('current');const p=document.querySelector('[data-index="'+position+'"]');p?.classList.add('current');if(follow&&p){const y=scrollY+p.getBoundingClientRect().top-document.querySelector('header').offsetHeight-30;window.scrollTo({top:Math.max(0,y),behavior:'smooth'});}sync();}
function stop(){mode='paused';generation++;clearTimeout(timer);if(synth)synth.cancel();utterance=null;save();sync();}
function speak(i,token){if(mode!=='speech'||token!==generation)return;position=i;highlight(true);save();utterance=new SpeechSynthesisUtterance(data.pairs[i].en);utterance.lang='en-US';utterance.rate=Number(settings.rate);utterance.pitch=Number(settings.pitch);const v=voices.find(v=>v.voiceURI===settings.voice);if(v)utterance.voice=v;utterance.onend=()=>{if(token!==generation)return;if(i+1<data.pairs.length)speak(i+1,token);else stop();};utterance.onerror=e=>{if(token!==generation)return;stop();$('status').textContent='朗读未成功：'+e.error+'。请换一种声音后再试。';};synth.speak(utterance);}
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en\b/i.test(v.lang));$('voice').replaceChildren();if(!voices.length){$('voice').add(new Option('等待系统英文声音…',''));return;}const preferred=voices.find(v=>/Daniel/i.test(v.name))||voices.find(v=>/Alex|David|George|James|Thomas|Aaron/i.test(v.name))||voices.find(v=>v.default)||voices[0];if(!voices.some(v=>v.voiceURI===settings.voice))settings.voice=preferred.voiceURI;voices.forEach(v=>$('voice').add(new Option(v.name+' · '+v.lang+(v.localService?' · local':''),v.voiceURI)));$('voice').value=settings.voice;save();}
$('read').onclick=()=>{if(mode==='speech'){stop();return;}stop();if(!synth){$('status').textContent='此浏览器不支持朗读，请使用 Chrome。';return;}mode='speech';speak(position,generation);};
function scrollNext(token){if(mode!=='scroll'||token!==generation)return;highlight(true);save();let words=data.pairs[position].en.match(/\b[A-Za-z]+(?:['’-][A-Za-z]+)*\b/g)||[];timer=setTimeout(()=>{if(token!==generation)return;if(position+1>=data.pairs.length){stop();return;}position++;scrollNext(token);},Math.max(900,words.length*60000/settings.wpm));}
$('scroll').onclick=()=>{if(mode==='scroll'){stop();return;}stop();mode='scroll';scrollNext(generation);};
$('previous').onclick=()=>{stop();position=Math.max(0,position-1);highlight(true);save();};$('next').onclick=()=>{stop();position=Math.min(data.pairs.length-1,position+1);highlight(true);save();};$('locate').onclick=()=>highlight(true);
['wpm','rate','pitch'].forEach(k=>{$(k).oninput=()=>{const was=mode,value=Number($(k).value);stop();settings[k]=value;sync();save();if(was==='speech'){mode='speech';speak(position,generation);}else if(was==='scroll'){mode='scroll';scrollNext(generation);}};});
$('voice').onchange=()=>{const was=mode,value=$('voice').value;stop();settings.voice=value;save();if(was==='speech'){mode='speech';speak(position,generation);}};
$('zh').onclick=()=>{stop();settings.hidezh=!settings.hidezh;sync();save();};$('colors').onclick=()=>{settings.colors=!settings.colors;sync();save();};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;stop();try{const d=JSON.parse(await file.text());if(!valid(d))throw Error('需要 id、title 和 pairs，每组包含 en 与 zh');data=d;position=0;render();window.scrollTo(0,0);}catch(err){$('status').textContent='导入失败：'+err.message;}e.target.value='';};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='reading.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
addEventListener('wheel',()=>{if(mode!=='paused')stop();},{passive:true});addEventListener('touchstart',()=>{if(mode!=='paused')stop();},{passive:true});addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|SELECT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();if(mode!=='paused')stop();else $('read').click();}if(e.key==='Escape')stop();});addEventListener('visibilitychange',()=>{if(document.hidden)stop();});addEventListener('pagehide',stop);
render();loadVoices();if(synth)synth.addEventListener('voiceschanged',loadVoices);
</script></body></html>
