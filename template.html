<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meaning Reader · 意群阅读器</title><style>{{STYLE}}</style></head><body><header><div class="tools"><button id="read">朗读英文</button><select id="voice" aria-label="英文声音"></select><label>朗读语速 <input id="rate" type="range" min="0.6" max="1.4" step=".05"><output id="rateValue"></output></label><label>音调 <input id="pitch" type="range" min=".5" max="1.2" step=".05"><output id="pitchValue"></output></label><button id="scroll">自动滚动</button><label>阅读速度 <input id="wpm" type="range" min="60" max="450" step="10"><output id="wpmValue"></output> WPM</label><button id="previous">上一段</button><button id="next">下一段</button><button id="locate">定位当前段</button><button id="zh">隐藏中文</button><button id="colors">色块开／关</button><label>导入 JSON <input id="import" type="file" accept=".json,application/json"></label><button id="export">导出阅读材料</button></div><div id="status" role="status" aria-live="polite"></div></header><main><h1 id="title"></h1><p id="subtitle" class="intro"></p><div class="legend"><span class="main">主干</span><span class="condition">条件／时间</span><span class="reason">原因／目的</span><span class="contrast">转折</span><span class="modifier">修饰／解释</span></div><p class="intro">先读英文，再核对紧接其下的中文。点击中英文可以定位，朗读跟随同一组。声音取决于系统；音调调整不保证改变音色。不开页自动播放。</p><div id="book"></div></main><script>window.READER_DATA={{DATA}};</script><script>{{SCRIPT}}</script></body></html>
